apiVersion: v1
kind: Service
metadata:
  name: payment-api
  labels:
    app: payment-api
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics/"
    prometheus.io/port: "8000"
spec:
  selector:
    app: payment-api
  ports:
    - name: http
      port: 8000
      targetPort: http
  type: ClusterIP
