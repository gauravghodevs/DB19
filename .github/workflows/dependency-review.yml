name: Dependency Review

on:
  pull_request:
    branches:
      - main
    paths:
      - "applications/payment-api/requirements.txt"
      - "applications/payment-api/requirements-dev.txt"
      - "**/pyproject.toml"
      - "**/poetry.lock"
      - "**/uv.lock"
      - "**/package-lock.json"
      - "**/pnpm-lock.yaml"
      - "**/yarn.lock"
      - "**/requirements*.txt"
      - ".github/workflows/dependency-review.yml"

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check dependencies for vulnerable additions
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: always
