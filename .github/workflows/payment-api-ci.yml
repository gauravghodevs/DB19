name: Payment API CI

on:
  push:
    branches: [main]
    paths:
      - "applications/payment-api/**"
      - "kubernetes/**"
      - ".github/workflows/payment-api-ci.yml"
  pull_request:
    paths:
      - "applications/payment-api/**"
      - "kubernetes/**"
      - ".github/workflows/payment-api-ci.yml"

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/payment-api

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: applications/payment-api/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run API tests
        run: python -m pytest -q

      - name: Check Python style
        run: python -m ruff check app tests

  validate-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Render Kustomize manifests
        run: kubectl kustomize kubernetes/base > rendered-manifests.yaml

      - name: Validate rendered Kubernetes schemas
        run: |
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary - \
            < rendered-manifests.yaml

  docker-build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build payment API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: applications/payment-api/Dockerfile
          push: false
          load: true
          tags: secureops-payment-api:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: secureops-payment-api:ci
          format: table
          output: trivy-image.txt
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: payment-api-trivy-report
          path: trivy-image.txt
          if-no-files-found: ignore
          retention-days: 14
