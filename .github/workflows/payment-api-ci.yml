name: Payment API CI

on:
  push:
    branches: [main]
    paths:
      - "applications/payment-api/**"
      - ".github/workflows/payment-api-ci.yml"
  pull_request:
    paths:
      - "applications/payment-api/**"
      - ".github/workflows/payment-api-ci.yml"

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/payment-api

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: applications/payment-api/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run API tests
        run: python -m pytest -q

      - name: Check Python style
        run: python -m ruff check app tests

  docker-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build payment API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: applications/payment-api/Dockerfile
          push: false
          tags: secureops-payment-api:ci
