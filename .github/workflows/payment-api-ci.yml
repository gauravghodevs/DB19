name: Payment API CI

on:
  push:
    branches: [main]
    paths:
      - "applications/payment-api/**"
      - "kubernetes/**"
      - "scripts/**"
      - "argocd/**"
      - "observability/**"
      - ".github/workflows/payment-api-ci.yml"
  pull_request:
    paths:
      - "applications/payment-api/**"
      - "kubernetes/**"
      - "scripts/**"
      - "argocd/**"
      - "observability/**"
      - ".github/workflows/payment-api-ci.yml"

permissions:
  contents: read

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: applications/payment-api

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: applications/payment-api/requirements-dev.txt

      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run API tests
        run: python -m pytest -q

      - name: Check Python style
        run: python -m ruff check app tests

  shell-and-manifest-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install --yes shellcheck

      - name: Validate Bash syntax
        shell: bash
        run: |
          while IFS= read -r -d '' script; do
            echo "Checking: $script"
            bash -n "$script"
          done < <(find scripts -type f -name '*.sh' -print0)

      - name: Run ShellCheck
        run: shellcheck scripts/*.sh

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Render and verify Kubernetes manifests
        shell: bash
        run: |
          set -Eeuo pipefail
          rendered="$RUNNER_TEMP/secureops-rendered.yaml"

          kubectl kustomize kubernetes/base > "$rendered"

          grep -q '^kind: Deployment$' "$rendered"
          grep -q '^kind: Service$' "$rendered"
          grep -q 'name: payment-api' "$rendered"

          echo "Kubernetes rendering and resource checks passed."

  validate-kubernetes:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up kubectl
        uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4

      - name: Render application and observability manifests
        run: |
          set -eu
          kubectl kustomize kubernetes/base > rendered-payment-api.yaml
          kubectl kustomize observability > rendered-observability.yaml

      - name: Validate rendered Kubernetes schemas
        run: |
          set -eu
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary - < rendered-payment-api.yaml
          docker run --rm -i \
            ghcr.io/yannh/kubeconform:v0.6.7 \
            -strict -summary - < rendered-observability.yaml

  docker-build-and-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build payment API image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: applications/payment-api/Dockerfile
          push: false
          load: true
          tags: secureops-payment-api:ci

      - name: Smoke-test container and verify non-root user
        shell: bash
        run: |
          set -Eeuo pipefail

          container_name=payment-api-smoke

          cleanup() {
            docker logs "$container_name" 2>/dev/null || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run -d \
            --name "$container_name" \
            -p 127.0.0.1:8000:8000 \
            secureops-payment-api:ci

          runtime_user="$(docker inspect \
            --format '{{.Config.User}}' "$container_name")"

          test "$runtime_user" = "10001:10001"
          echo "PASS: container is configured to run as non-root."

          for attempt in $(seq 1 30); do
            if curl --fail --silent \
              http://127.0.0.1:8000/health >/dev/null; then
              echo "PASS: payment API health endpoint responded."
              exit 0
            fi

            if [ "$(docker inspect \
              --format '{{.State.Running}}' "$container_name")" != "true" ]; then
              echo "FAIL: container exited before becoming healthy." >&2
              docker logs "$container_name" || true
              exit 1
            fi

            sleep 2
          done

          echo "FAIL: payment API did not become healthy within 60 seconds." >&2
          exit 1

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: secureops-payment-api:ci
          format: table
          output: trivy-image.txt
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: payment-api-trivy-report
          path: trivy-image.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag scanned image for GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/gauravghodevs/secureops-payment-api
          IMAGE_TAG: ${{ github.sha }}
        run: docker tag secureops-payment-api:ci "$IMAGE:$IMAGE_TAG"

      - name: Publish scanned image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE: ghcr.io/gauravghodevs/secureops-payment-api
          IMAGE_TAG: ${{ github.sha }}
        run: docker push "$IMAGE:$IMAGE_TAG"
