name: Kubernetes Security Scan

on:
  push:
    branches: [main]
    paths:
      - "kubernetes/**"
      - "observability/**"
      - ".github/workflows/kubernetes-security.yml"
  pull_request:
    paths:
      - "kubernetes/**"
      - "observability/**"
      - ".github/workflows/kubernetes-security.yml"

permissions:
  contents: read

jobs:
  trivy-config-scan:
    name: Scan Kubernetes manifests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manifest-path:
          - kubernetes/base
          - observability

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate Kustomize manifests
        run: kubectl kustomize "${{ matrix.manifest-path }}" > /dev/null
      - name: Scan Kubernetes configuration with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ${{ matrix.manifest-path }}
          severity: HIGH,CRITICAL
          format: table
          exit-code: "1"
