name: Infrastructure Validation

on:
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/infrastructure-validation.yml"
  pull_request:
    paths:
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/infrastructure-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: infrastructure-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform-validation:
    name: Terraform Format and Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform/aws-networking

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform init -backend=false -input=false

      - name: Validate Terraform configuration
        run: terraform validate -no-color

  ansible-validation:
    name: Ansible Syntax Validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install Ansible
        run: python -m pip install ansible-core==2.19.14

      - name: Check Ansible playbook syntax
        run: >-
          ansible-playbook
          -i ansible/inventory/localhost.ini
          ansible/playbooks/audit.yml
          --syntax-check
