apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alert-rules
  namespace: monitoring
data:
  alert-rules.yml: |
    groups:
      - name: secureops-payment-api
        rules:
          - alert: PaymentAPIDown
            expr: absent(up{job="kubernetes-services",service="payment-api"}) or max by (service) (up{job="kubernetes-services",service="payment-api"}) == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "No scrapeable Payment API targets"
              description: "For more than one minute, Prometheus has had no scrapeable payment-api targets: all discovered targets may be down, or service discovery may have returned none."
